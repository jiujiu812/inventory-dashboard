<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲吉零售库存看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'PingFang SC', sans-serif; background: #f5f5f0; color: #1a1a1a; }
  .header { background: #1a1a1a; color: #fff; padding: 24px 32px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  .header .date { font-size: 13px; color: #999; }
  .container { max-width: 1280px; margin: 0 auto; padding: 24px 32px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: #fff; border-radius: 12px; padding: 18px 20px; display: flex; gap: 14px; }
  .stat-card .icon { font-size: 26px; line-height: 1; padding-top: 2px; }
  .stat-card .info { flex: 1; min-width: 0; }
  .stat-card .header-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .stat-card .num { font-size: 26px; font-weight: 700; line-height: 1; }
  .stat-card .label { font-size: 12px; color: #777; }
  .stat-card .items { font-size: 12px; line-height: 1.5; }
  .stat-card .item { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #f0f0f0; }
  .stat-card .item:last-child { border-bottom: none; }
  .stat-card .item-name { font-weight: 500; color: #333; }
  .stat-card .item-stock { color: #999; font-size: 11px; }
  .stat-card.urgent { border-left: 4px solid #ef4444; }
  .stat-card.warning { border-left: 4px solid #f97316; }
  .stat-card.ok { border-left: 4px solid #22c55e; }
  .stat-card.urgent .num { color: #ef4444; }
  .stat-card.warning .num { color: #f97316; }
  .stat-card.ok .num { color: #22c55e; }

  .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; }
  .chart-card { background: #fff; border-radius: 12px; padding: 20px 24px; }
  .chart-card h2 { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }
  .chart-wrap { position: relative; }

  .section-title { font-size: 13px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .product-card { background: #fff; border-radius: 10px; padding: 14px 16px; border-top: 3px solid #e5e5e5; }
  .product-card.urgent { border-top-color: #ef4444; }
  .product-card.warning { border-top-color: #f97316; }
  .product-card.ok { border-top-color: #22c55e; }
  .product-card .name { font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #1a1a1a; }
  .product-card .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px; }
  .product-card .val { font-size: 18px; font-weight: 700; line-height: 1; }
  .product-card .lbl { font-size: 11px; color: #999; margin-top: 2px; }
  .product-card.urgent .days-val { color: #ef4444; }
  .product-card.warning .days-val { color: #f97316; }
  .product-card.ok .days-val { color: #22c55e; }
  .product-card .pack-info { font-size: 11px; color: #888; padding-top: 6px; border-top: 1px dashed #f0f0f0; }
  .product-card .pack-warn { color: #f97316; font-weight: 600; }
  .product-card .pack-ok { color: #22c55e; }

  .progress-wrap { margin-top: 8px; }
  .progress-bar { height: 5px; background: #f0f0f0; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; }
  .progress-label { font-size: 10px; color: #999; margin-top: 3px; }

  .footer { text-align: center; font-size: 12px; color: #bbb; padding: 16px; }
</style>
</head>
<body>

<div class="header">
  <h1>闲吉零售 · 库存看板</h1>
  <span class="date">数据更新：2026-05-30</span>
</div>

<div class="container">

  <div class="stats">
    <div class="stat-card urgent">
      <div class="icon">🚨</div>
      <div class="info">
        <div class="header-row">
          <div class="num">1</div>
          <div class="label">紧急 · 今天联系供应商</div>
        </div>
        <div class="items"><div class="item"><span class="item-name">不锈钢茶勺</span><span class="item-stock">库存 440 / 10天</span></div></div>
      </div>
    </div>
    <div class="stat-card warning">
      <div class="icon">⚡</div>
      <div class="info">
        <div class="header-row">
          <div class="num">0</div>
          <div class="label">注意 · 本周内启动</div>
        </div>
        <div class="items"><div class="item"><span class="item-name" style="color:#bbb">无</span></div></div>
      </div>
    </div>
    <div class="stat-card ok">
      <div class="icon">✅</div>
      <div class="info">
        <div class="header-row">
          <div class="num">11</div>
          <div class="label">充足 · 可用 28+ 天</div>
        </div>
        <div class="items"><div class="item"><span class="item-name">云境抹茶40g罐装</span><span class="item-stock">库存 365 / 28天</span></div><div class="item"><span class="item-name">听森抹茶粉50g罐装</span><span class="item-stock">库存 866 / 33天</span></div><div class="item"><span class="item-name">云境抹茶100g袋装</span><span class="item-stock">库存 66 / 35天</span></div><div class="item"><span class="item-name">摇摇杯</span><span class="item-stock">库存 99 / 48天</span></div><div class="item"><span class="item-name" style="color:#999">…还有 7 个</span></div></div>
      </div>
    </div>
  </div>

  <div class="charts">
    <div class="chart-card">
      <h2>各商品预计可用天数</h2>
      <div class="chart-wrap" style="height:300px"><canvas id="daysChart"></canvas></div>
    </div>
    <div class="chart-card">
      <h2>近30天销量占比</h2>
      <div class="chart-wrap" style="height:300px"><canvas id="salesChart"></canvas></div>
    </div>
  </div>

  <div class="section-title">商品库存详情（含包装库存）</div>
  <div class="product-grid" id="productGrid"></div>

</div>

<div class="footer">每周一更新 · 数据来源：ERP库存表 + 飞书包装台账</div>

<script>
const products = [
  {
    "name": "不锈钢茶勺",
    "level": "urgent",
    "stock": 440,
    "daily": 42.9,
    "days": 10,
    "s30": 1288,
    "restock": 10,
    "hasPack": true,
    "packStock": null,
    "packDetail": "无外包装"
  },
  {
    "name": "云境抹茶40g罐装",
    "level": "ok",
    "stock": 365,
    "daily": 12.9,
    "days": 28,
    "s30": 386,
    "restock": 17,
    "hasPack": false,
    "packStock": 0,
    "packDetail": "云境40g外纸盒:0 / 云境贴纸（外盒+罐体）:0"
  },
  {
    "name": "听森抹茶粉50g罐装",
    "level": "ok",
    "stock": 866,
    "daily": 26.2,
    "days": 33,
    "s30": 785,
    "restock": 10,
    "hasPack": true,
    "packStock": 1218,
    "packDetail": "听森50g外纸盒:1218 / 听森贴纸（罐体）:1218"
  },
  {
    "name": "云境抹茶100g袋装",
    "level": "ok",
    "stock": 66,
    "daily": 1.9,
    "days": 35,
    "s30": 57,
    "restock": 17,
    "hasPack": false,
    "packStock": 0,
    "packDetail": "云境100g黑色袋:0 / 云境100g贴纸:200"
  },
  {
    "name": "摇摇杯",
    "level": "ok",
    "stock": 99,
    "daily": 2.1,
    "days": 48,
    "s30": 62,
    "restock": 17,
    "hasPack": false,
    "packStock": 0,
    "packDetail": "摇摇杯外盒:0"
  },
  {
    "name": "抹茶坚果雪球曲奇",
    "level": "ok",
    "stock": 1177,
    "daily": 22.9,
    "days": 51,
    "s30": 686,
    "restock": 7,
    "hasPack": true,
    "packStock": null,
    "packDetail": "无外包装"
  },
  {
    "name": "浓焙焙茶40g罐装",
    "level": "ok",
    "stock": 312,
    "daily": 4.1,
    "days": 77,
    "s30": 122,
    "restock": 17,
    "hasPack": false,
    "packStock": 0,
    "packDetail": "焙茶40g外纸盒:0 / 焙茶贴纸（外盒+罐体）:0"
  },
  {
    "name": "真茶筅",
    "level": "ok",
    "stock": 131,
    "daily": 1.5,
    "days": 87,
    "s30": 45,
    "restock": 4,
    "hasPack": true,
    "packStock": 150,
    "packDetail": "真茶筅外盒贴纸:150"
  },
  {
    "name": "数穗茶筅",
    "level": "ok",
    "stock": 168,
    "daily": 1.8,
    "days": 95,
    "s30": 53,
    "restock": 10,
    "hasPack": false,
    "packStock": 20,
    "packDetail": "数穗茶筅外盒贴纸:20"
  },
  {
    "name": "渐绿茶筅立",
    "level": "ok",
    "stock": 95,
    "daily": 0.9,
    "days": 102,
    "s30": 28,
    "restock": 5,
    "hasPack": true,
    "packStock": 155,
    "packDetail": "渐绿茶筅立外盒:155"
  },
  {
    "name": "素玉茶碗",
    "level": "ok",
    "stock": 56,
    "daily": 0.5,
    "days": 112,
    "s30": 15,
    "restock": 7,
    "hasPack": false,
    "packStock": 0,
    "packDetail": "素玉茶碗贴纸:0"
  },
  {
    "name": "祝荣抹茶30g罐装",
    "level": "ok",
    "stock": 398,
    "daily": 3.2,
    "days": 126,
    "s30": 95,
    "restock": 17,
    "hasPack": false,
    "packStock": 0,
    "packDetail": "祝荣30g外纸盒:0 / 祝荣贴纸（外盒+罐体）:0"
  }
]
const colorMap = { urgent: '#ef4444', warning: '#f97316', ok: '#22c55e' }

const sorted = [...products].sort((a, b) => a.days - b.days)
new Chart(document.getElementById('daysChart'), {
  type: 'bar',
  data: {
    labels: sorted.map(p => p.name),
    datasets: [{ data: sorted.map(p => p.days), backgroundColor: sorted.map(p => colorMap[p.level]), borderRadius: 4 }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + ctx.raw + ' 天' } } },
    scales: {
      x: { grid: { color: '#f0f0f0' }, ticks: { font: { size: 11 } } },
      y: { grid: { display: false }, ticks: { font: { size: 11 } } }
    }
  }
})

const top6 = [...products].sort((a, b) => b.s30 - a.s30).slice(0, 6)
const others = products.filter(p => !top6.includes(p)).reduce((s, p) => s + p.s30, 0)
new Chart(document.getElementById('salesChart'), {
  type: 'doughnut',
  data: {
    labels: [...top6.map(p => p.name), '其他'],
    datasets: [{ data: [...top6.map(p => p.s30), others], backgroundColor: ['#1a1a1a','#4a4a4a','#6b7280','#9ca3af','#d1d5db','#e5e7eb','#f3f4f6'], borderWidth: 0 }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    plugins: {
      legend: { position: 'bottom', labels: { font: { size: 11 }, boxWidth: 10, padding: 6 } },
      tooltip: { callbacks: { label: ctx => ' ' + ctx.label + ': ' + ctx.raw + '件' } }
    }
  }
})

const grid = document.getElementById('productGrid')
const maxDays = Math.max(...products.map(p => p.days))
products.forEach(p => {
  const pct = Math.min(p.days / maxDays * 100, 100)
  const color = colorMap[p.level]
  let packHtml = ''
  if (p.packStock === null) {
    packHtml = '<div class="pack-info">包装：无外包装</div>'
  } else if (p.hasPack) {
    packHtml = '<div class="pack-info pack-ok">📦 包装库存 ' + p.packStock + ' 份（充足）· 走 ' + p.restock + ' 天周期</div>'
  } else {
    packHtml = '<div class="pack-info pack-warn">⚠️ 包装库存 ' + p.packStock + ' 份（不足）· 需先订包装 · 走 ' + p.restock + ' 天周期</div>'
  }
  grid.innerHTML += `
    <div class="product-card ${p.level}">
      <div class="name">${p.name}</div>
      <div class="metrics">
        <div><div class="val days-val">${p.days}天</div><div class="lbl">预计可用</div></div>
        <div><div class="val">${p.stock}</div><div class="lbl">当前库存</div></div>
        <div><div class="val">${p.daily}</div><div class="lbl">日均销量</div></div>
        <div><div class="val">${p.restock}天</div><div class="lbl">补货周期</div></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
        <div class="progress-label">近30天销量 ${p.s30} 件</div>
      </div>
      ${packHtml}
    </div>
  `
})
</script>
</body>
</html>
