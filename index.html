<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲吉零售库存看板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'PingFang SC', sans-serif; background: #f5f5f0; color: #1a1a1a; }
  .header { background: #1a1a1a; color: #fff; padding: 24px 32px; display: flex; justify-content: space-between; align-items: center; }
  .header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  .header .date { font-size: 13px; color: #999; }
  .container { max-width: 1280px; margin: 0 auto; padding: 24px 32px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: #fff; border-radius: 12px; padding: 18px 20px; }
  .stat-card .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .stat-card .icon { font-size: 22px; }
  .stat-card .num { font-size: 24px; font-weight: 700; line-height: 1; }
  .stat-card .label { font-size: 12px; color: #777; }
  .stat-card .items .item-row { padding: 8px 0; border-bottom: 1px dashed #f0f0f0; }
  .stat-card .items .item-row:last-child { border-bottom: none; }
  .stat-card .item-name { font-size: 13px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
  .stat-card .item-action { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .stat-card .item-meta { font-size: 11px; color: #999; margin-top: 2px; }
  .stat-card.urgent { border-left: 4px solid #ef4444; }
  .stat-card.warning { border-left: 4px solid #f97316; }
  .stat-card.ok { border-left: 4px solid #22c55e; }
  .stat-card.urgent .num { color: #ef4444; }
  .stat-card.warning .num { color: #f97316; }
  .stat-card.ok .num { color: #22c55e; }

  .charts { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; }
  .chart-card { background: #fff; border-radius: 12px; padding: 20px 24px; }
  .chart-card h2 { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 14px; letter-spacing: 0.5px; }
  .chart-wrap { position: relative; }

  .section-title { font-size: 13px; font-weight: 600; color: #555; letter-spacing: 0.5px; margin-bottom: 12px; }
  .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .product-card { background: #fff; border-radius: 10px; padding: 16px; border-top: 3px solid #e5e5e5; }
  .product-card.urgent { border-top-color: #ef4444; }
  .product-card.warning { border-top-color: #f97316; }
  .product-card.ok { border-top-color: #22c55e; }
  .product-card .pname { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #1a1a1a; }

  /* 关键日期区块 */
  .key-dates { background: #fafafa; border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .key-dates .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 12px; }
  .key-dates .row .lbl { color: #888; }
  .key-dates .row .val { font-weight: 600; }
  .key-dates .row.start .val { font-size: 13px; }
  .product-card.urgent .key-dates .start .val { color: #ef4444; }
  .product-card.warning .key-dates .start .val { color: #f97316; }
  .product-card.ok .key-dates .start .val { color: #22c55e; }
  .key-dates .out .val { color: #555; }

  /* 详细数据区 */
  .detail { font-size: 11px; color: #999; line-height: 1.6; }
  .detail .line { display: flex; justify-content: space-between; }

  .pack-info { font-size: 11px; padding: 6px 8px; margin-top: 8px; border-radius: 4px; }
  .pack-info.warn { background: #fff7ed; color: #c2410c; }
  .pack-info.good { background: #f0fdf4; color: #166534; }
  .pack-info.none { background: #fafafa; color: #888; }

  .action-box { font-size: 12px; padding: 10px 12px; margin-top: 8px; border-radius: 6px; line-height: 1.5; }
  .action-box.ok { background: #f0fdf4; }
  .action-box.warn { background: #fff7ed; }
  .action-box .action-title { font-weight: 600; margin-bottom: 6px; }
  .action-box.ok .action-title { color: #166534; }
  .action-box.warn .action-title { color: #c2410c; }
  .action-box .action-line { color: #333; padding: 1px 0; }
  .action-box .action-sub { font-size: 11px; color: #666; margin-top: 6px; padding-top: 6px; border-top: 1px dashed rgba(0,0,0,0.08); }

  .trend-badge { font-size: 11px; }
  .trend-info { font-size: 11px; padding: 6px 10px; margin-top: 8px; border-radius: 4px; background: #fef3c7; color: #92400e; }

  .footer { text-align: center; font-size: 12px; color: #bbb; padding: 16px; }
</style>
</head>

const colorMap = { urgent: '#ef4444', warning: '#f97316', ok: '#22c55e' }

function fmtDate(dateStr) {
  const d = new Date(dateStr)
  const w = ['日','一','二','三','四','五','六'][d.getDay()]
  return (d.getMonth()+1) + '月' + d.getDate() + '日（周' + w + '）'
}
function fmtStartHint(item) {
  if (item.startDays <= 0) return '今天必须下单'
  return fmtDate(item.startDate) + '前下单'
}

    datasets: [{ data: sorted.map(p => p.days), backgroundColor: sorted.map(p => colorMap[p.level]), borderRadius: 4 }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    maintainAspectRatio: false,
    plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + ctx.raw + ' 天 · 断货 ' + fmtDate(sorted[ctx.dataIndex].outDate) } } },
    scales: {

      y: { grid: { display: false }, ticks: { font: { size: 11 } } }

const others = products.filter(p => !top6.includes(p)).reduce((s, p) => s + p.s30, 0)

  type: 'doughnut',
  data: {
    labels: [...top6.map(p => p.name), '其他'],
    datasets: [{ data: [...top6.map(p => p.s30), others], backgroundColor: ['#1a1a1a','#4a4a4a','#6b7280','#9ca3af','#d1d5db','#e5e7eb','#f3f4f6'], borderWidth: 0 }]

    maintainAspectRatio: false,
    plugins: {

      tooltip: { callbacks: { label: ctx => ' ' + ctx.label + ': ' + ctx.raw + '件' } }
    }
  }

const grid = document.getElementById('productGrid')
products.forEach(p => {
  let actionHtml
  if (p.packStock === null) {
    // 无外包装的商品（如茶勺、曲奇）
    actionHtml = '<div class="action-box ok">' +
      '<div class="action-title">📞 联系供应商</div>' +
      '<div class="action-line">向 <b>' + p.productSupplier + '</b> 下单 ' + p.moq + ' 件（' + p.productCycle + '天到货）</div>' +
      '</div>'
  } else if (p.hasPack) {
    // 包装够：只联系成品商
    const batches = Math.floor(p.packStock / p.moq)
    actionHtml = '<div class="action-box ok">' +
      '<div class="action-title">📞 联系成品商</div>' +
      '<div class="action-line">向 <b>' + p.productSupplier + '</b> 下单 ' + p.moq + ' 件（' + p.productCycle + '天到货）</div>' +
      '<div class="action-sub">✅ 包装 ' + p.packStock + ' 份充足，可撑约 ' + batches + ' 次起订</div>' +
      '</div>'
  } else {
    // 包装不够：双线并行
    const need = p.moq - p.packStock
    actionHtml = '<div class="action-box warn">' +
      '<div class="action-title">📞 双线并行下单</div>' +
      '<div class="action-line">① 向 <b>' + p.productSupplier + '</b> 订成品 ' + p.moq + ' 件（' + p.productCycle + '天）</div>' +
      '<div class="action-line">② 向 <b>' + p.packSupplier + '</b> 订包装 ' + need + '+ 份（' + p.packCycle + '天）</div>' +
      '<div class="action-sub">⚠️ 包装仅 ' + p.packStock + ' 份 < 起订量 ' + p.moq + '，并行下单可省时间</div>' +
      '</div>'
  }

  grid.innerHTML += `
    <div class="product-card ${p.level}">
      <div class="pname">${p.name}${p.trend ? ' <span class="trend-badge">' + (p.trend.includes('涨') || p.trend.includes('快') ? '📈' : '📉') + '</span>' : ''}</div>
      <div class="key-dates">
        <div class="row start"><span class="lbl">📅 应启动补货</span><span class="val">${fmtStartHint(p)}</span></div>
        <div class="row out"><span class="lbl">🚫 预计断货</span><span class="val">${fmtDate(p.outDate)}</span></div>
      </div>
      ${actionHtml}
      ${p.trend ? '<div class="trend-info">' + p.trend + '</div>' : ''}
      <div class="detail">
        <div class="line"><span>当前库存</span><span>${p.stock} 件</span></div>
        <div class="line"><span>日均销量</span><span>${p.daily} / 近7天 ${p.daily7}</span></div>
        <div class="line"><span>近30天</span><span>${p.s30} 件</span></div>
        <div class="line"><span>安全库存（含${p.safetyDays}天缓冲）</span><span>${p.safetyStock} 件</span></div>
        <div class="line"><span>补货周期</span><span>${p.restock} 天${p.packCycle ? '（成品' + p.productCycle + ' · 包装' + p.packCycle + '）' : ''}</span></div>
      </div>
    </div>
  `
})
